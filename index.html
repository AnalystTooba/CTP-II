<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS Dashboard — LDA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}

body {
  font-family: 'Tahoma', Geneva, Verdana, sans-serif;
  background: #eef2fb;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── HEADER ─── */
header {
  position:relative;z-index:10;
  background: #0a1844;
  box-shadow: 0 4px 32px rgba(10,24,68,0.28);
}
.header-inner {
  max-width:1200px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 40px;gap:24px;
}
.header-logo {
  display:flex;align-items:center;gap:16px;flex-shrink:0;
}
.header-logo img {
  height:68px;width:auto;
  filter:drop-shadow(0 0 14px rgba(255,255,255,0.25));
}
.logo-fallback {
  width:68px;height:68px;
  background:rgba(255,255,255,0.15);
  border:2px solid rgba(255,255,255,0.3);
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:bold;color:#fff;letter-spacing:1px;
}
.header-center {text-align:center;flex:1;}

.header-title {
  font-size:clamp(22px,3vw,34px);
  font-weight:bold;color:#ffffff;letter-spacing:3px;
  text-transform:uppercase;
  text-shadow:0 2px 16px rgba(0,0,0,0.25);
  line-height:1.1;
}
.header-title span {
  background:#ffffff;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.header-subtitle {
  font-size:12px;letter-spacing:2px;color:rgba(255,255,255,0.65);
  margin-top:6px;text-transform:uppercase;
}
.header-right {
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;
}

.live-dot {
  width:7px;height:7px;border-radius:50%;
  background:#10b981;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(0.8);}}
.header-clock {font-size:11px;color:rgba(255,255,255,0.45);}

/* ─── MAIN ─── */
main {
  position:relative;z-index:1;
  max-width:1200px;margin:0 auto;
  padding:60px 40px 80px;
}

/* ─── CARD GRID ─── */
.card-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:32px;
  max-width:900px;margin:0 auto;
}
@media(max-width:720px){.card-grid{grid-template-columns:1fr;}}

.portal-card {
  background:#ffffff;
  border-radius:20px;
  border:1px solid rgba(26,63,166,0.10);
  box-shadow:0 4px 24px rgba(26,63,166,0.08);
  overflow:hidden;
  text-decoration:none;
  display:block;
  transition:transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  cursor:pointer;
  position:relative;
}
.portal-card:hover {
  transform:translateY(-8px);
  box-shadow:0 20px 50px rgba(26,63,166,0.16);
  border-color:rgba(26,63,166,0.25);
}
.portal-card:hover .card-arrow { transform:translateX(4px); }

/* top accent stripe */
.portal-card .card-stripe {
  height:5px;width:100%;display:block;
}

/* thumbnail area for PNG images */
.card-thumb {
  height: 180px;
  background: #f5f5f5;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* remove old decorative elements */
.card-thumb-icon,
.card-thumb-bg,
.card-thumb::before,
.card-thumb::after,
.card-stripe {
  display: none;
}

/* card body */
.card-body {
  padding:24px 26px 26px;
  border-top:1px solid rgba(26,63,166,0.06);
}
.card-tag {
  display:inline-block;
  font-size:9px;font-weight:bold;letter-spacing:2px;
  text-transform:uppercase;padding:3px 10px;border-radius:20px;
  margin-bottom:10px;
}
.card-name {
  font-size:18px;font-weight:bold;color:#0f1e3c;
  line-height:1.2;margin-bottom:8px;
}

.card-footer {
  display:flex;align-items:center;justify-content:space-between;
}
.card-cta {
  font-size:12px;font-weight:bold;letter-spacing:1px;
  text-transform:uppercase;display:flex;align-items:center;gap:6px;
  padding:8px 18px;border-radius:8px;border:none;cursor:pointer;
  transition:all 0.2s;
  font-family:'Tahoma',sans-serif;
}
.card-arrow {
  transition:transform 0.2s;font-size:11px;
}
.card-meta {
  font-size:10px;color:#a0b4cc;letter-spacing:0.5px;
  display:flex;align-items:center;gap:4px;
}

/* scroll reveal */
.portal-card { opacity:0; transform:translateY(30px); animation:reveal 0.5s ease forwards; }
.portal-card:nth-child(1){ animation-delay:0.1s; }
.portal-card:nth-child(2){ animation-delay:0.22s; }
@keyframes reveal{to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-logo">
      <img src="logo.png" alt="LDA Logo"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div class="logo-fallback" style="display:none">LDA</div>
    </div>
    <div class="header-center">
      <div class="header-title"><span>LDA GIS Dashboard</span></div>
      <div class="header-subtitle">Geospatial Intelligence &amp; Monitoring Platform</div>
    </div>
    <div class="header-right">
      <div class="header-clock" id="clock"></div>
    </div>
  </div>
</header>

<main>

  <div class="card-grid">

    <!-- Card 1: Illegal Commercial Recovery -->
    <a class="portal-card card-icr" href="dashboard.html">
      <span class="card-stripe"></span>
      <div class="card-thumb">
        <img src="illegal-commercial.png" alt="Illegal Commercial Recovery">
      </div>
      <div class="card-body">
        <span class="card-tag"><i class="fas fa-circle" style="font-size:6px;margin-right:4px;"></i> Active</span>
        <div class="card-name">Illegal Commercial Recovery</div>
        <div class="card-footer">
          <button class="card-cta">
            Open Dashboard <i class="fas fa-arrow-right card-arrow"></i>
          </button>
          <span class="card-meta"><i class="fas fa-database"></i> 3 Zone Files</span>
        </div>
      </div>
    </a>

    <!-- Card 2: New List A Roads -->
    <a class="portal-card card-roads" href="roads.html">
      <span class="card-stripe"></span>
      <div class="card-thumb">
        <img src="roads.png" alt="New List A Roads">
      </div>
      <div class="card-body">
        <span class="card-tag" style="background:rgba(124,58,237,0.10);color:#7c3aed;"><i class="fas fa-circle" style="font-size:6px;margin-right:4px;"></i> Coming Soon</span>
        <div class="card-name">New List A Roads</div>
        <div class="card-footer">
          <button class="card-cta">
            Open Module <i class="fas fa-arrow-right card-arrow"></i>
          </button>
          <span class="card-meta" style="color:#a08bb8;"><i class="fas fa-hourglass-half"></i> Setup Pending</span>
        </div>
      </div>
    </a>

  </div>
</main>

<footer>
</footer>

<script>
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleDateString('en-PK',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}) +
    ' · ' + now.toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tick, 1000); tick();
</script>
</body>
</html>
